<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironcreed Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }
        
        .logo-container {
            text-align: center;
        }
        
        .logo-text {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 4rem;
            font-weight: 800;
            color: #d97706;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg width="240" height="360" viewBox="0 0 24 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Mouse body -->
            <rect x="2" y="2" width="20" height="30" rx="10" fill="#1a3a52" stroke="#d97706" stroke-width="2"/>
            <!-- Mouse scroll wheel -->
            <rect x="10" y="8" width="4" height="8" rx="2" fill="#d97706"/>
            <!-- Bottom detail -->
            <path d="M12 28C12 28 8 26 8 22M12 28C12 28 16 26 16 22" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="logo-text">Ironcreed</div>
    </div>
</body>
</html>
